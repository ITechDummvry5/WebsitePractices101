        <!-- [0] -->
            <input type="text" placeholder="write anime" id="js-anime">
            <input type="number" placeholder="write ranking" class="js-ranking">
            <button onclick="addAnimeRank()">add</button>
            <p id="js-anime-display"></p>

<body>
 <script>
// [1] Data
const animelist = [
//     {
//     naming: 'test',
//     ranking: 2
// }
];


// [2] Render / display
function renderAnimeList() {
    let DisplayListHTML = '';

    for (let i = 0; i < animelist.length; i++) {
        const elementArrayObject = animelist[i];
        const { naming, ranking } = elementArrayObject;

        const html = `
            <div>${naming}</div>
            <div>${ranking}</div>
            <button onclick="
                animelist.splice(${i}, 1);
                renderAnimeList();
            ">Delete</button>
        `;

        DisplayListHTML += html;
    }

    document.getElementById('js-anime-display')
        .innerHTML = DisplayListHTML;
}

// [3] Add data
function addAnimeRank() {
    const inputElementAnime = document.getElementById('js-anime');
    const naming = inputElementAnime.value;

    const inputElementRank = document.getElementsByClassName('js-ranking')[0];
    const ranking = inputElementRank.value;

    animelist.push({
        naming,
        ranking
    });

    inputElementAnime.value = '';
    inputElementRank.value = '';
    
    renderAnimeList();
}

// [4] Initial display
renderAnimeList();

        let ArrayOne = [1, 20, 22, 24, 5]; // count = 5, index = 0,1,2,3,4
        let ArrayTwo = ['hi', 'hello', 'bye']; // count = 3, index = 0,1,2

        function getLastValue(lastIndex) {
            return lastIndex[lastIndex.length - 1];
            // Why -1? Because the last index is always 1 less than the count of values.
            // 5 values → last index = 4 | 3 values → last index = 2
        }

        console.log(ArrayOne);
        console.log(getLastValue(ArrayOne)); // 5 because the last index is 4

        console.log(ArrayTwo);
        console.log(getLastValue(ArrayTwo)); // bye because the last index is 2
