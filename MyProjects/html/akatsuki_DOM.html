<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akatsuki </title>
</head>
<body>
    <main>
        <section>
            <h3>Akatsuki No Yona Love List</h3>
            <input type="text" class="main-lead" onkeydown="handleKeyDown(event)" placeholder="Enter a male leading character name">
            <button onclick="MatchMain()">Match</button>
            <p class="match-status"></p>
        </section>

        <section>
            <h3>Akatsuki No Yona Best Chapter</h3>
            <input type="text" class="best-chapter" placeholder="Enter the best chapter" onkeydown="handleChapterKeyDown(event)">
            <button onclick="BestChapter()">Find Best Chapter</button>
            <p class="best-chapter-status"></p>
        </section>
    </main>

    <script>

        
        function handleKeyDown(event){
            console.log(event.key);
            if (event.key === 'Enter') {
                MatchMain();
            }
        }

function MatchMain() {
    const mainResult = document.querySelector('.main-lead');

    const inputMale = mainResult.value
        .replace(/\s/g, '')
        .toUpperCase();

    const checkValue =
        inputMale !== '' && !Number.isNaN(Number(inputMale))
            ? 'Not A String'
            : inputMale === 'HAK' || inputMale === 'SONHAK'
                ? `Yona crush is ${inputMale}`
                : `Yona is not interested in ${inputMale}`;

    document.querySelector('.match-status').innerHTML = checkValue;
}

        function handleChapterKeyDown(event) {
            console.log(event.key);
            if (event.key === 'Enter') {
                BestChapter();
            }
        }

function BestChapter() {
    const bestChapterInput = document.querySelector('.best-chapter');

    const inputChapter = bestChapterInput.value
        .trim()
        .toLowerCase();

    const bestChapterValue =
        inputChapter !== '' && !Number.isNaN(Number(inputChapter))
            ? 'Not A String'
            : inputChapter === 'chapter 1' || inputChapter === 'chapter 2'
                ? `Best chapter is ${inputChapter}`
                : `Not the best chapter`;

    document.querySelector('.best-chapter-status').innerHTML = bestChapterValue;
}


    </script>
</body>
</html>
