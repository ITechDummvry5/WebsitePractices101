<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 5 - Variables</title>
</head>
<body>
    <hr>

    <button
    onclick="console.log(`Cart Show : ${Addtocart}`);">
    Cart Show</button>

    <button
    onclick="
    Addtocart = Addtocart + 1;
    console.log(`Cart Add  ${Addtocart}`);">
    Add To Cart </button>

    <button
    onclick="
    Addtocart = Addtocart - 1;
    console.log(`Cart Cancelled  ${Addtocart}`);">
    Cancel Cart</button>

    <button
    onclick="Addtocart = 0;
    console.log(`Cart Remove  ${Addtocart}`);
    console.log(`Cart Show After Remove: ${Addtocart}`);">
    Remove Cart</button>

    
    <p>ShortCut </p>

    <button onclick="console.log(`Vehicles: ${vehicleCount}`);">
    View Vehicles
</button>

<button onclick="
    vehicleCount += 1;
    console.log(`Vehicle Added: ${vehicleCount}`);
">
    Add Vehicle
</button>

<button onclick="
    vehicleCount -= 1;
    console.log(`Vehicle Removed: ${vehicleCount}`);
">
    Remove Vehicle
</button>

<button onclick="
    vehicleCount = 0;
    console.log(`All Vehicles Cleared: ${vehicleCount}`);
">
    Clear Vehicles
</button>

    <script src="04-variables.js"></script>

</body>
</html>
