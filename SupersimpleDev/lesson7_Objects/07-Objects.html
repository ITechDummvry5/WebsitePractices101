<!DOCTYPE html>
<html>
  <head>
    <title>Objects</title>
  </head>
  <body>
    <script>
      const anime = {
        protagonist : 'Luffy',
        bounty : 3000000000
      }

// Displays the entire anime object
console.log(anime);

// Accesses and displays the protagonist property 
console.log(anime.protagonist);
// Accesses and displays the bounty property
console.log(typeof anime.bounty);
    </script>
  </body>
</html>
