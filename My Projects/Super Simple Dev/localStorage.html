function calculateTotal() {
    const userInput = document.querySelector('.user-input');
    const cost = Number(userInput.value);

    // Check if the value is not a number.
    // If true: display "Not a number".
    // If false: check whether cost is greater than 40.
    const result = Number.isNaN(cost)
        ? 'Not a number'
        : cost > 40
            ? `$${cost + 10}`
            : `$${cost}`;

    document.querySelector('.display-Cost')
        .innerHTML = result;
}


    const display = document.getElementById("display");
    // Load saved data when page opens
    const savedAnime = JSON.parse(localStorage.getItem("anime"));
    if (savedAnime) {
      alert(`${savedAnime.anime} - ${savedAnime.character}`);

      display.textContent =
        `${savedAnime.anime} - ${savedAnime.character}`;
    }
    
    function saveAnime() {

      const animeData = {
        anime: document.getElementById("animeInput").value,
        character: document.getElementById("characterInput").value
      };
      // Store object
      localStorage.setItem(
        "anime",
        JSON.stringify(animeData)
      );

      alert(`${animeData.anime} - ${animeData.character}`);

      display.textContent =
        `${animeData.anime} - ${animeData.character}`;
    }
