<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Page Setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice Projects</title>
</head>
<body>

    <!-- ===================================================== -->
    <!-- ROCK PAPER SCISSORS -->
    <!-- Concepts:
         - Functions
         - Arrays
         - Random Selection
         - Conditional Statements
         - textContent
    -->
    <!-- ===================================================== -->

    <h1>Rock Paper Scissors</h1>

    <!--
        this.textContent
        Gets the text inside the clicked button
    -->
    <button onclick="playGame(this.textContent)">Rock</button>
    <button onclick="playGame(this.textContent)">Paper</button>
    <button onclick="playGame(this.textContent)">Scissors</button>

    <script>
        function playGame(userChoice) {

            // Array of possible choices
            const choices = ['Rock', 'Paper', 'Scissors'];

            /*
                Randomly select an item from an array

                choices.length = 3

                Math.random()       -> 0 to 0.999...
                * choices.length    -> 0 to 2.999...
                Math.floor()        -> 0, 1, or 2
            */
            const computerChoice =
                choices[Math.floor(Math.random() * choices.length)];

            console.log(`Computer chose ${computerChoice}`);

            let result;

            // Determine winner
            if (computerChoice === userChoice) {
                result = "It's a tie!";
            } else if (
                (userChoice === 'Rock' && computerChoice === 'Scissors') ||
                (userChoice === 'Paper' && computerChoice === 'Rock') ||
                (userChoice === 'Scissors' && computerChoice === 'Paper')
            ) {
                result = 'You win!';
            } else {
                result = 'You lose!';
            }

            alert(
                `Your move: ${userChoice} | Computer move: ${computerChoice} | ${result}`
            );
        }
    </script>



    <!-- ===================================================== -->
    <!-- BLACKJACK -->
    <!-- Concepts:
         - Arrays
         - Objects
         - Event Listeners
         - Dataset
         - Random Numbers
         - reduce()
         - push()
         - join()
    -->
    <!-- ===================================================== -->

    <h1>Blackjack</h1>

    <!--
        data-action
        Stores custom data inside HTML elements
    -->
    <button data-action="start">New Game</button>
    <button data-action="hit">Hit</button>
    <button data-action="stand">Stand</button>

    <h3>Your Cards</h3>
    <p id="cards">-</p>

    <h3>Your Score</h3>
    <p id="score">0</p>

    <h3>Result</h3>
    <p id="result">Click New Game</p>

    <script>

        // Store player's cards
        let playerCards = [];

        // Track game status
        let gameOver = false;

        /*
            Generate a random card value

            Math.random() * 10
            -> 0 to 9.999...

            Math.floor()
            -> 0 to 9

            +1
            -> 1 to 10
        */
        function drawCard() {
            return Math.floor(Math.random() * 10) + 1;
        }

        function updateUI() {

            /*
                reduce()

                Calculate total score by adding
                every card value together
            */
            const score =
                playerCards.reduce(
                    (sum, card) => sum + card,
                    0
                );

            /*
                join()

                Convert array into text

                [4, 7, 2]
                -> "4, 7, 2"
            */
            document.getElementById('cards').textContent =
                playerCards.join(', ');

            document.getElementById('score').textContent =
                score;

            if (score > 21) {
                document.getElementById('result').textContent =
                    'Bust! You lose!';

                gameOver = true;
            }
        }

        function startGame() {

            gameOver = false;

            // Start with 2 random cards
            playerCards = [
                drawCard(),
                drawCard()
            ];

            document.getElementById('result').textContent =
                'Game started!';

            updateUI();
        }

        function hit() {

            if (gameOver) return;

            /*
                push()

                Add a new item
                to the end of an array
            */
            playerCards.push(drawCard());

            updateUI();
        }

        function stand() {

            if (gameOver) return;

            const playerScore =
                playerCards.reduce(
                    (sum, card) => sum + card,
                    0
                );

            // Random dealer score
            const dealerScore =
                Math.floor(Math.random() * 11) + 16;

            if (
                dealerScore > 21 ||
                playerScore > dealerScore
            ) {
                document.getElementById('result').textContent =
                    `You win! Dealer: ${dealerScore}`;
            }
            else if (
                playerScore === dealerScore
            ) {
                document.getElementById('result').textContent =
                    `Tie! Dealer: ${dealerScore}`;
            }
            else {
                document.getElementById('result').textContent =
                    `You lose! Dealer: ${dealerScore}`;
            }

            gameOver = true;
        }

        /*
            Object

            Stores related functions
            using key-value pairs
        */
        const actions = {
            start: startGame,
            hit: hit,
            stand: stand
        };

        /*
            querySelectorAll()

            Select all buttons
            on the page
        */
        document
            .querySelectorAll('button')
            .forEach(button => {

                /*
                    addEventListener()

                    Run code when
                    button is clicked
                */
                button.addEventListener('click', () => {

                    const action =
                        button.dataset.action;

                    /*
                        dataset

                        Reads data-action
                        from HTML

                        Example:
                        data-action="hit"

                        button.dataset.action
                        -> "hit"
                    */
                    actions[action]?.();
                });
            });
    </script>



    <!-- ===================================================== -->
    <!-- LUCKY DRAW -->
    <!-- Concepts:
         - Arrays
         - length
         - Random Index
         - Array Access
    -->
    <!-- ===================================================== -->

    <h1>Lucky Draw</h1>

    <button onclick="drawPrize()">
        Draw Prize
    </button>

    <p id="prizeResult">
        Click the button
    </p>

    <script>

        // Array of possible prizes
        const prizes = [
            '🍎 Apple',
            '🍌 Banana',
            '🍕 Pizza',
            '🍔 Burger',
            '🍟 Fries'
        ];

        function drawPrize() {

            /*
                length

                Returns total number
                of items in an array

                prizes.length
                -> 5
            */
            const randomIndex =
                Math.floor(
                    Math.random() * prizes.length
                );

            /*
                Array Access

                Get item using index

                prizes[0]
                prizes[1]
                prizes[2]
                ...
            */
            const prize =
                prizes[randomIndex];

            document.getElementById(
                'prizeResult'
            ).textContent =
                `You won: ${prize}`;
        }
    </script>

</body>
</html>
